<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Gestión de Categorías</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos personalizados para scroll interno en la tabla -->
    <style>
        .table-scroll {
            max-height: 400px; /* Altura máxima de la tabla (ajusta según necesites) */
            overflow-y: auto; /* Scroll vertical interno */
        }
                /* Encabezados fijos */
        .table-scroll thead th {
            position: sticky;
            top: 0;
 
            z-index: 100;
            border-bottom: 2px solid #dee2e6;
        }

        /* Asegurar que las celdas tengan buen contraste */
        .table-scroll thead th {
            color: white;
            padding: 12px 8px;
        }
    </style>
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container mt-4">
        <!-- ========== SECCIÓN DE GESTIÓN DE CATEGORÍAS ========== -->
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Gestión de Categorías</h2>
            </div>
            <div class="card-body">
                <!-- Botones de acción y búsqueda -->
                <div class="row mb-3 align-items-center">
                    <div class="col-md-6">
                        <button id="btnNuevaCategoria" class="btn btn-primary">Nueva Categoría</button>
                        <button id="btnEditarCategoria" class="btn btn-warning" disabled>Editar</button>
                        <button id="btnEliminarCategoria" class="btn btn-danger" disabled>Eliminar</button>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" class="form-control" id="inputBuscarCategoria" placeholder="Buscar por nombre de categoría...">
                            <button class="btn btn-outline-secondary" type="button" id="btnLimpiarBusquedaCategoria" title="Limpiar búsqueda">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de categorías -->
                <div class="table-responsive table-scroll">
                    <table class="table table-striped table-hover" id="tablaCategorias">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Ultima Actualizacion</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL PARA AGREGAR/EDITAR CATEGORÍA ========== -->
    <div class="modal fade" id="modalCategoria" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTituloCategoria">
                        <i class="bi bi-tags"></i> Nueva Categoría
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formCategoria">
                        <input type="hidden" id="idCategoria">
                        <div class="mb-3">
                            <label for="nombreCategoria" class="form-label">
                                <i class="bi bi-tag"></i> Nombre de la Categoría
                            </label>
                            <input type="text" class="form-control" id="nombreCategoria" required placeholder="Ingrese el nombre">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" id="btnGuardarCategoria">
                        <i class="bi bi-check-circle"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL DE CONFIRMACIÓN DE ELIMINACIÓN DE CATEGORÍA ========== -->
    <div class="modal fade" id="modalEliminarCategoria" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">¿Desea eliminar la categoría <strong id="nombreCategoriaEliminar"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminarCategoria">Sí, Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODALES DE ÉXITO Y ERROR ========== -->
    <div class="modal fade" id="modalExito" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Éxito</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0" id="mensajeExito"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalError" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Error</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0" id="mensajeError"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== JAVASCRIPT PRINCIPAL ========== -->
    <script>
        (function () {
            // ========== VARIABLES GLOBALES ==========
            let categoriasFiltradas = [];
            let filaSeleccionadaCategoria = null;
            let modoEdicionCategoria = false;
            let modalCategoria;
            let debounceTimerCategoria;

            // ========== FUNCIÓN PARA BUSCAR CATEGORÍAS ==========
            function buscarCategorias(textoBusqueda = '') {
                // MOSTRAR LOADING AL INICIAR BÚSQUEDA
                $('#tablaCategorias tbody').html(`
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                <div class="spinner-border spinner-border-sm" role="status"></div>
                                <span class="ms-2">Buscando clientes...</span>
                            </td>
                        </tr>
                    `);


                clearTimeout(debounceTimerCategoria);
                debounceTimerCategoria = setTimeout(() => {
                    $.ajax({
                        url: `/api/Categorias/buscar?buscar=${encodeURIComponent(textoBusqueda)}`,
                        method: "GET",
                        success: function (data) {
                            categoriasFiltradas = data.map(cat => ({
                                idCategoria: cat.idCategoria,
                                nombre: cat.nombre.trim(),
                                ultimaActualizacion: cat.ultimaActualizacion,
                                estado: cat.estado
                            }));
                            renderTablaCategorias();
                            filaSeleccionadaCategoria = null;
                            $("#btnEditarCategoria, #btnEliminarCategoria").prop("disabled", true);
                        },
                        error: function (err) {
                            console.error("Error buscando categorías:", err);
                            $("#mensajeError").text("Error al buscar categorías. Intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                            modalError.show();
                        }
                    });
                }, 300);
            }

            // ========== FUNCIÓN PARA RENDERIZAR LA TABLA ==========
            function renderTablaCategorias() {
                let tbody = $("#tablaCategorias tbody");
                tbody.empty();
                if (categoriasFiltradas.length === 0) {
                    tbody.append(`<tr><td colspan="2" class="text-center text-muted">No se encontraron categorías con ese criterio de búsqueda</td></tr>`);
                    return;
                }
                categoriasFiltradas.forEach((cat, i) => {
                    tbody.append(`
                        <tr data-index="${i}">
                            <td>${cat.nombre}</td>
                            <td>${new Date(cat.ultimaActualizacion).toLocaleString()}</td>
                        </tr>
                    `);
                });
                $("#tablaCategorias tbody tr").click(function () {
                    if ($(this).find('td').length === 1) return;
                    $("#tablaCategorias tbody tr").removeClass("table-primary");
                    $(this).addClass("table-primary");
                    filaSeleccionadaCategoria = $(this).data("index");
                    $("#btnEditarCategoria, #btnEliminarCategoria").prop("disabled", false);
                });
            }

            // ========== FUNCIÓN PARA ABRIR MODAL NUEVA CATEGORÍA ==========
            function abrirModalNuevaCategoria() {
                modoEdicionCategoria = false;
                $("#formCategoria")[0].reset();
                $("#idCategoria").val("");
                $("#modalTituloCategoria").text("Nueva Categoría");
                $("#btnGuardarCategoria").text("Guardar").removeClass("btn-warning").addClass("btn-primary");
                modalCategoria.show();
            }

            // ========== FUNCIÓN PARA ABRIR MODAL EDITAR CATEGORÍA ==========
            function abrirModalEditarCategoria() {
                if (filaSeleccionadaCategoria === null) {
                    alert("Seleccione una categoría para editar");
                    return;
                }
                modoEdicionCategoria = true;
                let cat = categoriasFiltradas[filaSeleccionadaCategoria];
                $("#idCategoria").val(cat.idCategoria);
                $("#nombreCategoria").val(cat.nombre);
                $("#modalTituloCategoria").text("Editar Categoría");
                $("#btnGuardarCategoria").text("Guardar Cambios").removeClass("btn-success").addClass("btn-warning");
                modalCategoria.show();
            }

            // ========== FUNCIÓN PARA GUARDAR CATEGORÍA ==========
            function guardarCategoria() {
                if (!$("#formCategoria")[0].checkValidity()) {
                    $("#formCategoria")[0].reportValidity();
                    return;
                }

                if (modoEdicionCategoria) {
                    // ===== MODO EDICIÓN (PUT) =====
                    let cat = categoriasFiltradas[filaSeleccionadaCategoria];
                    let datos = {
                        idCategoria: cat.idCategoria,
                        nombre: $("#nombreCategoria").val(),
                        ultimaActualizacion: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, -1),
                        estado: true
                    };

                    $.ajax({
                        url: `/api/Categorias/${datos.idCategoria}`,
                        method: "PUT",
                        contentType: "application/json",
                        data: JSON.stringify(datos),
                        success: function () {
                            modalCategoria.hide();
                            $("#mensajeExito").text("La categoría fue actualizada exitosamente.");
                            let modalExito = new bootstrap.Modal(document.getElementById('modalExito'));
                            modalExito.show();
                            buscarCategorias($("#inputBuscarCategoria").val());
                            filaSeleccionadaCategoria = null;
                            $("#btnEditarCategoria, #btnEliminarCategoria").prop("disabled", true);
                        },
                        error: function (err) {
                            console.error(err);
                            modalCategoria.hide();
                            $("#mensajeError").text("No se pudo actualizar la categoría. Intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                            modalError.show();
                        }
                    });
                } else {
                    // ===== MODO AGREGAR (POST) =====
                    let datos = {
                        idCategoria: 0,
                        nombre: $("#nombreCategoria").val(),
                        ultimaActualizacion: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, -1),  // Fecha actual y hora actual donde se creo
                        estado: true
                    };

                    $.ajax({
                        url: "/api/Categorias",
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify(datos),
                        success: function () {
                            modalCategoria.hide();
                            $("#mensajeExito").text("La categoría fue agregada exitosamente.");
                            let modalExito = new bootstrap.Modal(document.getElementById('modalExito'));
                            modalExito.show();
                            buscarCategorias($("#inputBuscarCategoria").val());
                        },
                        error: function (err) {
                            console.error(err);
                            modalCategoria.hide();
                            $("#mensajeError").text("No se pudo agregar la categoría. Intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                            modalError.show();
                        }
                    });

                    
                }
            }

            // ========== FUNCIÓN PARA ELIMINAR CATEGORÍA ==========
            function eliminarCategoria() {
                if (filaSeleccionadaCategoria === null) {
                    alert("Seleccione una categoría para eliminar");
                    return;
                }
                let cat = categoriasFiltradas[filaSeleccionadaCategoria];
                $("#nombreCategoriaEliminar").text(cat.nombre);
                let modalEliminar = new bootstrap.Modal(document.getElementById('modalEliminarCategoria'));
                modalEliminar.show();
            }

            // ========== FUNCIÓN PARA CONFIRMAR ELIMINACIÓN ==========
            function confirmarEliminacionCategoria() {
                let cat = categoriasFiltradas[filaSeleccionadaCategoria];
                let modalEliminar = bootstrap.Modal.getInstance(document.getElementById('modalEliminarCategoria'));

                // Cambiar estado a false (eliminación lógica)
                let datos = {
                    idCategoria: cat.idCategoria,
                    nombre: cat.nombre,
                    ultimaActualizacion: cat.ultimaActualizacion,
                    estado: false  // Marcar como inactivo
                };

                $.ajax({
                    url: `/api/Categorias/${cat.idCategoria}`,
                    method: "PUT",
                    contentType: "application/json",
                    data: JSON.stringify(datos),
                    success: function () {
                        modalEliminar.hide();
                        $("#mensajeExito").text("La categoría fue eliminada exitosamente.");
                        let modalExito = new bootstrap.Modal(document.getElementById('modalExito'));
                        modalExito.show();
                        buscarCategorias($("#inputBuscarCategoria").val());
                        filaSeleccionadaCategoria = null;
                        $("#btnEditarCategoria, #btnEliminarCategoria").prop("disabled", true);
                    },
                    error: function (err) {
                        console.error(err);
                        modalEliminar.hide();
                        $("#mensajeError").text("No se pudo eliminar la categoría. Intente nuevamente.");
                        let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                        modalError.show();
                    }
                });
            }

            // ========== INICIALIZACIÓN ==========
            $(document).ready(function () {
                modalCategoria = new bootstrap.Modal(document.getElementById('modalCategoria'));
                buscarCategorias('');  // Cargar todas las categorías inicialmente

                // ===== EVENTOS =====
                $("#btnNuevaCategoria").click(abrirModalNuevaCategoria);
                $("#btnEditarCategoria").click(abrirModalEditarCategoria);
                $("#btnEliminarCategoria").click(eliminarCategoria);
                $("#btnGuardarCategoria").click(guardarCategoria);
                $("#btnConfirmarEliminarCategoria").click(confirmarEliminacionCategoria);

                // Búsqueda en tiempo real
                $("#inputBuscarCategoria").on("input", function () {
                    buscarCategorias($(this).val());
                });

                // Limpiar búsqueda
                $("#btnLimpiarBusquedaCategoria").click(function () {
                    $("#inputBuscarCategoria").val("");
                    buscarCategorias("");
                    filaSeleccionadaCategoria = null;
                    $("#btnEditarCategoria, #btnEliminarCategoria").prop("disabled", true);
                });

                // Limpiar formulario al cerrar modal
                $('#modalCategoria').on('hidden.bs.modal', function () {
                    $("#formCategoria")[0].reset();
                });

                // ===== FIX PARA ARIA-HIDDEN WARNING =====
                $('.modal').on('hide.bs.modal', function () {
                    $(this).find('*').blur();
                });

                $('.modal').on('hidden.bs.modal', function () {
                    if (document.activeElement && document.activeElement !== document.body) {
                        document.activeElement.blur();
                    }
                });
            });
        })();
    </script>
</body>
</html>
