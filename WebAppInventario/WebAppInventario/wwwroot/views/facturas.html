<body>

                    <!-- Buscador al lado derecho -->

                            </span>
                            <!-- AGREGAR ESTO: Input para fecha -->

                            <input type="text" class="form-control" id="inputBuscarFact" placeholder="Cliente o factura...">

                </div>
                <div class="modal-body">
                    <p class="mb-0" id="mensajeErrorFact"></p>
                </div>

                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">

    <!-- ========== JAVASCRIPT PRINCIPAL ========== -->
    <script>
        // Verificar si ya existe el módulo de facturas cargado
        if (typeof window.moduloFacturas !== 'undefined') {
            window.moduloFacturas.destruir();
        }

        window.moduloFacturas = (function () {
            // ========== VARIABLES GLOBALES ==========
            let facturasFiltradas = [];
            let filaSeleccionada = null;
            let modalDetalleFactura;
            let debounceTimer;

            // ========== FUNCIÓN PARA BUSCAR FACTURAS DESDE LA API CON FILTRO ANIDADO ==========
            // ========== FUNCIÓN PARA BUSCAR FACTURAS DESDE LA API CON FILTRO ANIDADO ==========
            function buscarFacturas(textoBusqueda = '', fechaFiltro = '') {

                // MOSTRAR LOADING AL INICIAR BÚSQUEDA
                $('#tablaFacturas tbody').html(`
        <tr>
            <td colspan="6" class="text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm" role="status"></div>
                <span class="ms-2">Buscando facturas...</span>
            </td>
        </tr>
    `);

                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {



                    // Construir URL con parámetros opcionales
                    let url = '/api/Facturas/filtrar-anidado?';
                    const params = [];

                    if (textoBusqueda) {
                        params.push(`buscar=${encodeURIComponent(textoBusqueda)}`);
                    }

                    if (fechaFiltro) {
                        // VALIDAR FECHA FUTURA
                        if (fechaFiltro) {
                            const hoy = new Date().toISOString().split('T')[0];
                            if (fechaFiltro > hoy) {
                                $("#mensajeErrorFact").text("No se pueden buscar facturas de fechas futuras.");
                                let modalError = new bootstrap.Modal(document.getElementById('modalErrorFact'));
                                modalError.show();
                                $("#filtroFecha").val(""); // Limpiar fecha inválida
                                fechaFiltro = "";
                            }
                        }
                        params.push(`fecha=${encodeURIComponent(fechaFiltro)}`);
                    }

                    url += params.join('&');

                    $.ajax({
                        url: url,
                        method: "GET",
                        success: function (data) {
                            facturasFiltradas = data.map(fact => ({
                                idFactura: fact.idFactura,
                                numeroFactura: fact.numeroFactura.trim(),
                                fecha: fact.fecha,
                                hora: fact.hora,
                                clienteNombre: fact.clienteNombre.trim(),
                                cajeroNombre: fact.cajeroNombre.trim(),
                                metodoPago: fact.metodoPago.trim(),
                                iva: fact.iva,
                                total: fact.total
                            }));
                            renderTabla();
                            filaSeleccionada = null;
                            $("#btnVerDetalleFact").prop("disabled", true);
                        },
                        error: function (err) {
                            console.error("Error buscando facturas:", err);
                            $("#mensajeErrorFact").text("Error al buscar facturas. Intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalErrorFact'));
                            modalError.show();
                        }
                    });
                }, 300);
            }

            // ======== FUNCION PARA FORMATEAR LA FECHA ====== 


            // ========== FUNCIÓN PARA RENDERIZAR LA TABLA ==========
            function renderTabla() {
                let tbody = $("#tablaFacturas tbody");
                tbody.empty();

                if (facturasFiltradas.length === 0) {
                    let mensaje = "No se encontraron facturas con ese criterio de búsqueda";
                    tbody.append(`
                        <tr>
                            <td colspan="4" class="text-center text-muted">
                            <i class="bi bi-search display-4 d-block mb-2"></i>
                            ${mensaje}
                            </td>
                        </tr>
                    `);
                    return;
                }

                facturasFiltradas.forEach((fact, i) => {
                    let fechaHora = `${new Date(fact.fecha + 'T00:00:00').toLocaleDateString('es-SV')} ${fact.hora}`;

                    tbody.append(`
                        <tr data-index="${i}">
                            <td>${fact.numeroFactura}</td>
                            <td>${fechaHora}</td>
                            <td>${fact.clienteNombre}</td>
                            <td>$${fact.total.toFixed(2)}</td>
                        </tr>
                    `);
                });

                $("#tablaFacturas tbody tr").click(function () {
                    if ($(this).find('td').length === 1) return;
                    $("#tablaFacturas tbody tr").removeClass("table-primary");
                    $(this).addClass("table-primary");
                    filaSeleccionada = $(this).data("index");

                    // Habilitar botón ver detalle
                    $("#btnVerDetalleFact").prop("disabled", false);
                });
            }

            // ========== FUNCIÓN PARA VER DETALLE DE FACTURA ==========
            function verDetalleFactura() {
                if (filaSeleccionada === null) {
                    alert("Seleccione una factura para ver el detalle");
                    return;
                }

                let facturaActual = facturasFiltradas[filaSeleccionada];

                // Cargar detalle desde la API
                $.ajax({
                    url: `/api/FacturasDetalles/por-idFactura/${facturaActual.idFactura}`,
                    method: "GET",
                    success: function (data) {
                        // Llenar información general
                        $("#numeroFacturaDetalle").text(facturaActual.numeroFactura);
                        $("#detalleCliente").text(facturaActual.clienteNombre);
                        $("#detalleCajero").text(facturaActual.cajeroNombre);
                        $("#detalleMetodoPago").text(facturaActual.metodoPago);

                        let fechaHora = `${new Date(facturaActual.fecha + 'T00:00:00').toLocaleDateString('es-SV')} ${facturaActual.hora}`;
                        $("#detalleFecha").text(fechaHora);
                        $("#detalleSubtotal").text(`$${(facturaActual.total - facturaActual.iva).toFixed(2)}`);
                        $("#detalleIVA").text(`$${facturaActual.iva.toFixed(2)}`);
                        $("#detalleTotal").text(`$${facturaActual.total.toFixed(2)}`);

                        // Llenar tabla de productos
                        let tbodyProductos = $("#tablaDetalleProductos tbody");
                        tbodyProductos.empty();

                        data.forEach(det => {
                            tbodyProductos.append(`
                                <tr>
                                    <td>${det.productoNombre.trim()}</td>
                                    <td>$${det.precio.toFixed(2)}</td>
                                    <td>${det.cantidad}</td>
                                    <td>$${det.subtotal.toFixed(2)}</td>
                                </tr>
                            `);
                        });

                        modalDetalleFactura.show();
                    },
                    error: function (err) {
                        console.error("Error cargando detalle:", err);
                        $("#mensajeErrorFact").text("Error al cargar el detalle de la factura.");
                        let modalError = new bootstrap.Modal(document.getElementById('modalErrorFact'));
                        modalError.show();
                    }
                });
            }

            // ========== INICIALIZACIÓN ==========
            function inicializar() {
                modalDetalleFactura = new bootstrap.Modal(document.getElementById('modalDetalleFactura'));

                // ESTABLECER FECHA MÁXIMA COMO HOY
                const hoy = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
                    .toISOString()
                    .split('T')[0];

                $("#filtroFecha").attr('max', hoy);

                buscarFacturas();

                $("#btnVerDetalleFact").click(verDetalleFactura);

                $("#inputBuscarFact").on("input", function () {
                    const textoBusqueda = $(this).val();
                    const fechaFiltro = $("#filtroFecha").val();
                    buscarFacturas(textoBusqueda, fechaFiltro);
                });

                // Evento para el filtro de fecha
                $("#filtroFecha").on("change", function () {
                    const textoBusqueda = $("#inputBuscarFact").val();
                    const fechaFiltro = $(this).val();
                    buscarFacturas(textoBusqueda, fechaFiltro);
                });

                // Botón Limpiar Búsqueda - Solo limpia el input de texto
                $("#btnLimpiarBusquedaFact").click(function () {
                    $("#inputBuscarFact").val("");
                    const fechaFiltro = $("#filtroFecha").val();
                    buscarFacturas("", fechaFiltro);
                    filaSeleccionada = null;
                    $("#btnVerDetalleFact").prop("disabled", true);
                });

                // Botón Refrescar - Limpia TODOS los filtros
                $("#btnRefrescar").click(function () {
                    $("#inputBuscarFact").val("");
                    $("#filtroFecha").val("");
                    buscarFacturas("", "");
                    filaSeleccionada = null;
                    $("#btnVerDetalleFact").prop("disabled", true);
                });
            }

            // ========== FUNCIÓN PARA DESTRUIR EL MÓDULO ==========
            function destruir() {
                clearTimeout(debounceTimer);
                $("#btnVerDetalleFact, #btnLimpiarBusquedaFact").off('click');
                $("#inputBuscarFact").off('input');
                $("#tablaFacturas tbody tr").off('click');

                if (modalDetalleFactura) {
                    modalDetalleFactura.hide();
                }
            }

            inicializar();

            return {
                destruir: destruir
            };
        })();

    </script>
