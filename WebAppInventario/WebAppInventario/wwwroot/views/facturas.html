<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartado de Facturas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .table-scroll {
            max-height: 300px; /* Altura máxima de la tabla (ajusta según necesites, ej. 500px para más filas) */
            overflow-y: auto; /* Scroll vertical interno */
        }
            /* Encabezados fijos */
            .table-scroll thead th {
                position: sticky;
                top: 0;
                z-index: 100;
                border-bottom: 2px solid #dee2e6;
            }

            /* Asegurar que las celdas tengan buen contraste */
            .table-scroll thead th {
                color: white;
                padding: 12px 8px;
            }
    </style>
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container-fluid mt-4">
        <!-- Tarjeta principal -->
        <div class="card shadow">
            <!-- Encabezado de la tarjeta -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h2 class="mb-0">
                    <i class="bi bi-receipt me-2"></i>Registro de Facturas
                </h2>
            </div>

            <!-- Cuerpo de la tarjeta -->
            <div class="card-body">
                <!-- Botones de acción y búsqueda en una fila -->
                <div class="row mb-3 align-items-center">
                    <!-- Botones de acción al lado izquierdo -->
                    <div class="col-md-6">
                        <button id="btnVerDetalleFact" class="btn btn-info btn-action" disabled>
                            <i class="bi bi-eye me-1"></i> Ver Detalle
                        </button>
                    </div>

                    <!-- Buscador al lado derecho -->
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" class="form-control" id="inputBuscarFact" placeholder="Buscar por cliente o número de factura...">
                            <button class="btn btn-outline-secondary" type="button" id="btnLimpiarBusquedaFact" title="Limpiar búsqueda">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de facturas con scroll responsive -->
                <div class="table-responsive table-scroll">
                    <table class="table table-striped table-hover mb-0" id="tablaFacturas">
                        <thead class="table-dark">
                            <tr>
                                <th>Nº Factura</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los datos de facturas se cargan dinámicamente aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL PARA VER DETALLE DE FACTURA ========== -->
    <div class="modal fade" id="modalDetalleFactura" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <!-- Encabezado del modal -->
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-receipt me-2"></i> Detalle de Factura #<span id="numeroFacturaDetalle"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <!-- Cuerpo del modal -->
                <div class="modal-body">
                    <!-- Información general de la factura -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <p><strong>Cliente:</strong> <span id="detalleCliente"></span></p>
                            <p><strong>Fecha:</strong> <span id="detalleFecha"></span></p>
                            <p><strong>Cajero:</strong> <span id="detalleCajero"></span></p>
                            <p><strong>Método de Pago:</strong> <span id="detalleMetodoPago"></span></p>
                        </div>
                        <div class="col-md-6 text-end">
                            <p><strong>Subtotal:</strong> <span id="detalleSubtotal"></span></p>
                            <p><strong>IVA:</strong> <span id="detalleIVA"></span></p>
                            <p><strong>Total:</strong> <span id="detalleTotal" class="fs-4 text-primary"></span></p>
                        </div>
                    </div>

                    <hr>

                    <!-- Tabla de productos -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="tablaDetalleProductos">
                            <thead class="table-dark">
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio Unit.</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Los productos se cargan dinámicamente aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pie del modal -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i> Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL DE ERROR ========== -->
    <div class="modal fade" id="modalErrorFact" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle me-2"></i>Error
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0" id="mensajeErrorFact"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i> Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== JAVASCRIPT PRINCIPAL ========== -->
    <script>
        // Verificar si ya existe el módulo de facturas cargado
        if (typeof window.moduloFacturas !== 'undefined') {
            window.moduloFacturas.destruir();
        }

        window.moduloFacturas = (function () {
            // ========== VARIABLES GLOBALES ==========
            let facturasFiltradas = [];
            let filaSeleccionada = null;
            let modalDetalleFactura;
            let debounceTimer;

            // ========== FUNCIÓN PARA BUSCAR FACTURAS DESDE LA API ==========
            function buscarFacturas(textoBusqueda = '') {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    $.ajax({
                        url: `/api/Facturas/buscar?buscar=${encodeURIComponent(textoBusqueda)}`,
                        method: "GET",
                        success: function (data) {
                            facturasFiltradas = data.map(fact => ({
                                idFactura: fact.idFactura,
                                numeroFactura: fact.numeroFactura.trim(),
                                fecha: fact.fecha,
                                hora: fact.hora,
                                clienteNombre: fact.clienteNombre.trim(),
                                cajeroNombre: fact.cajeroNombre.trim(),
                                metodoPago: fact.metodoPago.trim(),
                                iva: fact.iva,
                                total: fact.total
                            }));
                            renderTabla();
                            filaSeleccionada = null;
                            $("#btnVerDetalleFact").prop("disabled", true);
                        },
                        error: function (err) {
                            console.error("Error buscando facturas:", err);
                            $("#mensajeErrorFact").text("Error al buscar facturas. Intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalErrorFact'));
                            modalError.show();
                        }
                    });
                }, 300);
            }

            // ========== FUNCIÓN PARA RENDERIZAR LA TABLA ==========
            function renderTabla() {
                let tbody = $("#tablaFacturas tbody");
                tbody.empty();

                if (facturasFiltradas.length === 0) {
                    tbody.append(`
                        <tr>
                            <td colspan="4" class="text-center text-muted">
                                No se encontraron facturas con ese criterio de búsqueda
                            </td>
                        </tr>
                    `);
                    return;
                }

                facturasFiltradas.forEach((fact, i) => {
                    let fechaHora = `${new Date(fact.fecha).toLocaleDateString()} ${fact.hora}`;

                    tbody.append(`
                        <tr data-index="${i}">
                            <td>${fact.numeroFactura}</td>
                            <td>${fechaHora}</td>
                            <td>${fact.clienteNombre}</td>
                            <td>$${fact.total.toFixed(2)}</td>
                        </tr>
                    `);
                });

                $("#tablaFacturas tbody tr").click(function () {
                    if ($(this).find('td').length === 1) return;
                    $("#tablaFacturas tbody tr").removeClass("table-primary");
                    $(this).addClass("table-primary");
                    filaSeleccionada = $(this).data("index");

                    // Habilitar botón ver detalle
                    $("#btnVerDetalleFact").prop("disabled", false);
                });
            }

            // ========== FUNCIÓN PARA VER DETALLE DE FACTURA ==========
            function verDetalleFactura() {
                if (filaSeleccionada === null) {
                    alert("Seleccione una factura para ver el detalle");
                    return;
                }

                let facturaActual = facturasFiltradas[filaSeleccionada];

                // Cargar detalle desde la API
                $.ajax({
                    url: `/api/FacturasDetalles/por-idFactura/${facturaActual.idFactura}`,
                    method: "GET",
                    success: function (data) {
                        // Llenar información general
                        $("#numeroFacturaDetalle").text(facturaActual.numeroFactura);
                        $("#detalleCliente").text(facturaActual.clienteNombre);
                        $("#detalleCajero").text(facturaActual.cajeroNombre);
                        $("#detalleMetodoPago").text(facturaActual.metodoPago);

                        let fechaHora = `${new Date(facturaActual.fecha).toLocaleDateString()} ${facturaActual.hora}`;
                        $("#detalleFecha").text(fechaHora);
                        $("#detalleSubtotal").text(`$${(facturaActual.total - facturaActual.iva).toFixed(2)}`);
                        $("#detalleIVA").text(`$${facturaActual.iva.toFixed(2)}`);
                        $("#detalleTotal").text(`$${facturaActual.total.toFixed(2)}`);

                        // Llenar tabla de productos
                        let tbodyProductos = $("#tablaDetalleProductos tbody");
                        tbodyProductos.empty();

                        data.forEach(det => {
                            tbodyProductos.append(`
                                <tr>
                                    <td>${det.productoNombre.trim()}</td>
                                    <td>$${det.precio.toFixed(2)}</td>
                                    <td>${det.cantidad}</td>
                                    <td>$${det.subtotal.toFixed(2)}</td>
                                </tr>
                            `);
                        });

                        modalDetalleFactura.show();
                    },
                    error: function (err) {
                        console.error("Error cargando detalle:", err);
                        $("#mensajeErrorFact").text("Error al cargar el detalle de la factura.");
                        let modalError = new bootstrap.Modal(document.getElementById('modalErrorFact'));
                        modalError.show();
                    }
                });
            }

            // ========== INICIALIZACIÓN ==========
            function inicializar() {
                modalDetalleFactura = new bootstrap.Modal(document.getElementById('modalDetalleFactura'));
                buscarFacturas();

                $("#btnVerDetalleFact").click(verDetalleFactura);

                $("#inputBuscarFact").on("input", function () {
                    buscarFacturas($(this).val());
                });

                $("#btnLimpiarBusquedaFact").click(function () {
                    $("#inputBuscarFact").val("");
                    buscarFacturas("");
                    filaSeleccionada = null;
                    $("#btnVerDetalleFact").prop("disabled", true);
                });
            }

            // ========== FUNCIÓN PARA DESTRUIR EL MÓDULO ==========
            function destruir() {
                clearTimeout(debounceTimer);
                $("#btnVerDetalleFact, #btnLimpiarBusquedaFact").off('click');
                $("#inputBuscarFact").off('input');
                $("#tablaFacturas tbody tr").off('click');

                if (modalDetalleFactura) {
                    modalDetalleFactura.hide();
                }
            }

            inicializar();

            return {
                destruir: destruir
            };
        })();

    </script>
</body>
</html>
