<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema de Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!--Modificada por Wil-->

    <style>
        :root {
            --ferreteria-primary: #2C3E50;
            --ferreteria-accent: #E67E22;
            --ferreteria-light: #ECF0F1;
        }

        .bg-ferreteria {
            background: linear-gradient(135deg, var(--ferreteria-primary), #34495E);
        }

        .btn-ferreteria {
            background: linear-gradient(135deg, var(--ferreteria-accent), #D35400);
            border: none;
            padding: 12px;
            font-weight: 600;
            color: white;
        }

            .btn-ferreteria:hover {
                background: linear-gradient(135deg, #D35400, var(--ferreteria-accent));
                color: white;
                transform: translateY(-2px);
            }

        .login-right {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #fecfef 50%, #f5576c 75%, #4facfe 100%);
            position: relative;
        }

            .login-right::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(circle at 10% 20%, rgba(230, 126, 34, 0.4) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(44, 62, 80, 0.4) 0%, transparent 40%), radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
                z-index: 0;
            }
    </style>

</head>
<body class="bg-light">

    <div class="container-fluid vh-100">
        <div class="row h-100">
            <!-- Lado izquierdo: Texto de Logo -->
            <div class="col-md-6 d-flex justify-content-center align-items-center bg-ferreteria text-white">
                <div class="text-center">
                    <h1 class="display-4">LOGO</h1>
                    <p class="lead">(Placeholder)</p>
                </div>
            </div>

            <!-- Lado derecho: Formulario de Login -->
            <div class="col-md-6 d-flex justify-content-center align-items-center bg-light login-right">
                <div class="card shadow p-4" style="width: 380px;">
                    <h3 class="text-center mb-3">Iniciar Sesión</h3>

                    <div class="mb-3">
                        <label for="credencial" class="form-label">Credencial</label>
                        <input type="text" id="credencial" class="form-control" placeholder="Ingrese su credencial" required>
                    </div>

                    <div class="mb-3">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" id="contraseña" class="form-control" placeholder="Ingrese su contraseña" required>
                    </div>

                    <button class="btn btn-ferreteria w-100" id="btnLogin">Ingresar</button>

                    <div id="mensaje" class="text-danger text-center mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(() => {
            $('#btnLogin').click(() => {
                let credencial = $('#credencial').val().trim();
                let contraseña = $('#contraseña').val().trim();

                if (!credencial || !contraseña) {
                    $('#mensaje').text('Por favor, complete todos los campos.');
                    return;
                }

                // Llamada al endpoint de login
                $.ajax({
                    url: '/api/Empleados/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        credencial: credencial,
                        contraseña: contraseña
                    }),
                    success: (data) => {
                        // Login exitoso
                        localStorage.setItem('empleadoId', data.idEmpleado);
                        localStorage.setItem('empleadoRol', data.idRol);
                        localStorage.setItem('empleadoNombre', data.nombre);
                        localStorage.setItem('empleadoCredencial', data.credencial);
                        localStorage.setItem('empleadoRolNombre', data.rol);

                        // Redirigir
                        window.location.href = '/views/index.html';
                    },
                    error: (xhr) => {
                        if (xhr.status === 401) {
                            $('#mensaje').text('Credenciales incorrectas. Intente nuevamente.');
                        } else {
                            $('#mensaje').text('Error al iniciar sesión. Intente nuevamente.');
                        }
                    }
                });
            });

            // Login con Enter
            $('#contraseña').keypress((e) => {
                if (e.which === 13) {
                    $('#btnLogin').click();
                }
            });
        });
    </script>

</body>
</html>
