<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema de Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Lottie Player para Lordicon -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        /* ========== VARIABLES Y TIPOGRAFÍAS ========== */
        :root {
            --ferreteria-primary: #2C3E50;
            --ferreteria-accent: #E67E22;
            --ferreteria-dark: #1a1d21;
            --ferreteria-light: #ECF0F1;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }

        /* ========== LADO IZQUIERDO: LOGO ANIMADO ========== */
        .login-left {
            background: linear-gradient(135deg, var(--ferreteria-primary), #34495E);
            position: relative;
            overflow: hidden;
        }

            .login-left::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(circle at 20% 80%, rgba(230, 126, 34, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
                z-index: 1;
            }

        .login-left-content {
            position: relative;
            z-index: 2;
        }

        /* ========== LADO DERECHO: FORMULARIO ========== */
        .login-right {
            background: linear-gradient(135deg, #1a1d21 0%, #212529 100%);
            position: relative;
        }

            .login-right::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(circle at 10% 20%, rgba(44, 62, 80, 0.3) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(230, 126, 34, 0.2) 0%, transparent 40%);
                z-index: 0;
            }

        /* ========== CARD DEL FORMULARIO ========== */
        .login-card {
            background: rgba(33, 37, 41, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #343a40;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        /* ========== BOTÓN DE LOGIN MEJORADO ========== */
        .btn-login {
            background: linear-gradient(135deg, var(--ferreteria-accent), #D35400);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

            .btn-login:hover {
                background: linear-gradient(135deg, #D35400, var(--ferreteria-accent));
                color: white;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
            }

            .btn-login:active {
                transform: translateY(0);
            }

            /* Efecto ripple en el botón */
            .btn-login::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 5px;
                height: 5px;
                background: rgba(255, 255, 255, 0.5);
                opacity: 0;
                border-radius: 100%;
                transform: scale(1, 1) translate(-50%);
                transform-origin: 50% 50%;
            }

            .btn-login:focus:not(:active)::after {
                animation: ripple 1s ease-out;
            }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }

            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }

        /* ========== FORM CONTROLS MEJORADOS ========== */
        .form-control {
            border-radius: 8px;
            border: 2px solid #343a40;
            background: #2c3034;
            color: #e9ecef;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            padding: 12px;
        }

            .form-control:focus {
                border-color: var(--ferreteria-accent);
                background: #2c3034;
                color: #e9ecef;
                box-shadow: 0 0 0 0.2rem rgba(230, 126, 34, 0.25);
            }

            .form-control::placeholder {
                color: #6c757d;
            }

        .form-label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            color: #adb5bd;
            margin-bottom: 8px;
        }

        /* ========== LOGO Y ANIMACIONES ========== */
        .logo-container {
            transition: all 0.3s ease;
            cursor: pointer;
        }

            .logo-container:hover {
                transform: scale(1.05);
            }

        .logo-cargando {
            animation: pulse 0.8s infinite;
        }

        .logo-error {
            animation: shake 0.5s ease-in-out;
        }

        .logo-success {
            animation: bounce 1s ease-out;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        @keyframes bounce {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* ========== TÍTULOS Y TEXTO ========== */
        .login-title {
            background: linear-gradient(135deg, var(--ferreteria-accent), #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .system-title {
            background: linear-gradient(135deg, #ffffff, #e9ecef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* ========== FEATURE LIST MEJORADO ========== */
        .feature-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-item {
            color: #adb5bd;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

            .feature-item i {
                color: var(--ferreteria-accent);
                margin-right: 8px;
            }

        /* ========== ALERTS MEJORADOS ========== */
        .alert-login {
            border-radius: 8px;
            border: none;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        .alert-success {
            background: linear-gradient(135deg, #27AE60, #229954);
            color: white;
        }

        .alert-danger {
            background: linear-gradient(135deg, #E74C3C, #C0392B);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid vh-100">
        <div class="row h-100">
            <!-- Lado izquierdo: Logo Animado con Lordicon -->
            <div class="col-md-6 d-flex justify-content-center align-items-center login-left">
                <div class="text-center login-left-content">
                    <!-- Lordicon Animado -->
                    <div class="logo-container mb-4 d-flex justify-content-center" id="logoLogin">
                        <lottie-player id="lordiconAnimation"
                                       src="/css/animations/system-regular-63-settings-cog-hover-cog-1.json"
                                       background="transparent"
                                       speed="1"
                                       style="width: 250px; height: 250px; margin: 0 auto;"
                                       loop
                                       autoplay>
                        </lottie-player>
                    </div>

                    <h1 class="display-4 fw-bold system-title">FERRETERÍA EL MAESTRO</h1>
                    <p class="lead text-light opacity-75">Sistema de Inventario y Ventas</p>

                    <div class="feature-list">
                        <div class="feature-item">
                            <i class="bi bi-clipboard-data"></i> Gestion completa de inventario
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-cash-stack"></i> Punto de venta integrado
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-graph-up"></i> Reportes en tiempo real
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-people"></i> Control de empleados y clientes
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lado derecho: Formulario de Login -->
            <div class="col-md-6 d-flex justify-content-center align-items-center login-right">
                <div class="login-card shadow p-4" style="width: 400px;">
                    <div class="text-center mb-4">
                        <h3 class="login-title mb-2">Iniciar Sesión</h3>
                        <p class="text-muted">Ingresa tus credenciales para acceder al sistema</p>
                    </div>

                    <div class="mb-3">
                        <label for="credencial" class="form-label">
                            <i class="bi bi-person-circle me-2"></i>Credencial
                        </label>
                        <input type="text" id="credencial" class="form-control"
                               placeholder="Ingrese su credencial" required
                               onfocus="animarLogo('focus')"
                               onblur="animarLogo('normal')">
                    </div>

                    <div class="mb-4">
                        <label for="contraseña" class="form-label">
                            <i class="bi bi-shield-lock me-2"></i>Contraseña
                        </label>
                        <input type="password" id="contraseña" class="form-control"
                               placeholder="Ingrese su contraseña" required
                               onfocus="animarLogo('focus')"
                               onblur="animarLogo('normal')"
                               onkeyup="detectarEscritura()">
                    </div>

                    <button class="btn btn-login w-100 py-3 mb-3" id="btnLogin">
                        <span id="btnText">Ingresar al Sistema</span>
                        <div id="btnLoading" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </button>

                    <div id="mensaje" class="alert alert-login mt-3 d-none" role="alert"></div>

                    <div class="text-center mt-3">
                        <small class="text-muted">
                            <i class="bi bi-info-circle me-1"></i>
                            Sistema seguro - Versión 2.0
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        // EL JAVASCRIPT SE MANTIENE EXACTAMENTE IGUAL
        // Solo se mejoró el CSS para consistencia visual
        let lordiconPlayer;
        let typingTimer;
        const doneTypingInterval = 1000;

        $(document).ready(() => {
            setTimeout(() => {
                lordiconPlayer = document.getElementById('lordiconAnimation');
                configurarLordicon();
            }, 500);

            $('#btnLogin').click(procesarLogin);

            $('#contraseña').keypress((e) => {
                if (e.which === 13) {
                    procesarLogin();
                }
            });
        });

        function configurarLordicon() {
            if (lordiconPlayer) {
                lordiconPlayer.addEventListener('mouseenter', () => {
                    lordiconPlayer.setSpeed(1);
                });

                lordiconPlayer.addEventListener('mouseleave', () => {
                    lordiconPlayer.setSpeed(0.2);
                });
            }
        }

        function animarLogo(estado) {
            if (!lordiconPlayer) return;

            switch (estado) {
                case 'focus':
                    lordiconPlayer.setSpeed(1);
                    document.getElementById('logoLogin').classList.add('logo-cargando');
                    break;
                case 'normal':
                    lordiconPlayer.setSpeed(0.2);
                    document.getElementById('logoLogin').classList.remove('logo-cargando');
                    break;
                case 'error':
                    lordiconPlayer.setSpeed(0.5);
                    document.getElementById('logoLogin').classList.add('logo-error');
                    setTimeout(() => {
                        document.getElementById('logoLogin').classList.remove('logo-error');
                        lordiconPlayer.setSpeed(1);
                    }, 800);
                    break;
                case 'success':
                    lordiconPlayer.setSpeed(1.5);
                    document.getElementById('logoLogin').classList.add('logo-success');
                    setTimeout(() => {
                        document.getElementById('logoLogin').classList.remove('logo-success');
                    }, 600);
                    break;
                case 'loading':
                    lordiconPlayer.setSpeed(0.8);
                    document.getElementById('logoLogin').classList.add('logo-cargando');
                    break;
            }
        }

        function detectarEscritura() {
            const contraseña = $('#contraseña').val();

            if (contraseña.length > 0) {
                animarLogo('focus');
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    animarLogo('normal');
                }, doneTypingInterval);
            } else {
                animarLogo('normal');
            }
        }

        function procesarLogin() {
            let credencial = $('#credencial').val().trim();
            let contraseña = $('#contraseña').val().trim();

            if (!credencial || !contraseña) {
                mostrarMensaje('Por favor, complete todos los campos.', 'error');
                animarLogo('error');
                return;
            }

            $('#btnText').text('Verificando...');
            $('#btnLoading').removeClass('d-none');
            $('#btnLogin').prop('disabled', true);
            animarLogo('loading');

            $.ajax({
                url: '/api/Empleados/login',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    credencial: credencial,
                    contraseña: contraseña
                }),
                success: (data) => {
                    animarLogo('success');
                    mostrarMensaje('¡Acceso concedido! Redirigiendo...', 'success');

                    localStorage.setItem('empleadoId', data.idEmpleado);
                    localStorage.setItem('empleadoRol', data.idRol);
                    localStorage.setItem('empleadoNombre', data.nombre);
                    localStorage.setItem('empleadoCredencial', data.credencial);
                    localStorage.setItem('empleadoRolNombre', data.rol);

                    setTimeout(() => {
                        window.location.href = '/views/index.html';
                    }, 500);
                },
                error: (xhr) => {
                    $('#btnText').text('Ingresar al Sistema');
                    $('#btnLoading').addClass('d-none');
                    $('#btnLogin').prop('disabled', false);

                    if (xhr.status === 401) {
                        mostrarMensaje('Credenciales incorrectas. Intente nuevamente.', 'error');
                        animarLogo('error');
                    } else {
                        mostrarMensaje('Error al iniciar sesión. Intente nuevamente.', 'error');
                        animarLogo('error');
                    }
                }
            });
        }

        function mostrarMensaje(mensaje, tipo) {
            const mensajeElement = $('#mensaje');
            mensajeElement.removeClass('d-none alert-success alert-danger');

            if (tipo === 'success') {
                mensajeElement.addClass('alert-success');
            } else {
                mensajeElement.addClass('alert-danger');
            }

            mensajeElement.text(mensaje);

            if (tipo === 'success') {
                setTimeout(() => {
                    mensajeElement.addClass('d-none');
                }, 3000);
            }
        }

        $('#contraseña').on('input', function () {
            if (!lordiconPlayer) return;

            const longitud = $(this).val().length;
            if (longitud > 0 && longitud < 4) {
                lordiconPlayer.setSpeed(1.5);
            } else if (longitud >= 4 && longitud < 8) {
                lordiconPlayer.setSpeed(1.8);
            } else if (longitud >= 8) {
                lordiconPlayer.setSpeed(2);
            }
        });
    </script>
</body>
</html>
