<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Compras a Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Estilos similares al cajero, pero ajustados */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .container-fluid {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-info {
            flex-shrink: 0;
            background: var(--bs-primary-bg-subtle);
            padding: 0.1rem 0.2rem;
            border-radius: 0.2rem;
            margin-bottom: 0.1rem;
            font-size: 0.6rem;
        }

        .contenido-principal {
            flex: 1;
            overflow: hidden;
        }

        .row-contenido {
            height: 100%;
        }

        .card {
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        .card-header {
            flex-shrink: 0;
            padding: 0.1rem 0.2rem;
        }

            .card-header h6 {
                font-size: 0.7rem;
            }

        .card-body {
            flex: 1;
            padding: 0.2rem !important;
            overflow-y: auto;
        }

        .table-container {
            max-height: 120px;
            overflow-y: auto;
        }

        .form-label {
            margin-bottom: 0.05rem;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .mb-compact {
            margin-bottom: 0.1rem !important;
        }

        .totales-box {
            background: var(--bs-light);
            padding: 0.2rem;
            border-radius: 0.2rem;
            margin-top: 0.1rem;
            font-size: 0.6rem;
        }

            .totales-box .row {
                margin-bottom: 0.05rem;
            }

            .totales-box h6 {
                font-size: 0.8rem;
            }

        hr.compact {
            margin: 0.1rem 0;
        }

        .table-sm {
            font-size: 0.6rem;
        }

        .btn-sm {
            padding: 0.1rem 0.2rem;
            font-size: 0.6rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Header Info Compacto -->
        <div class="header-info">
            <div class="row text-center">
                <div class="col-3"><strong>Comprador:</strong> <span id="compradorNombre">Cargando...</span></div>
                <div class="col-3"><strong>Orden:</strong> <span id="ordenNumero">--</span></div>
                <div class="col-3"><strong>Fecha:</strong> <span id="fechaActual">--</span></div>
                <div class="col-3"><strong>Hora:</strong> <span id="horaActual">--</span></div>
            </div>
        </div>

        <!-- Contenido Principal -->
        <div class="contenido-principal">
            <div class="row row-contenido g-1">
                <!-- Panel Izquierdo: Formulario -->
                <div class="col-md-5">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h6 class="mb-0"><i class="bi bi-cart-plus"></i> Nueva Compra</h6>
                        </div>
                        <div class="card-body">
                            <!-- Búsqueda de Proveedor -->
                            <div class="mb-compact">
                                <label for="busquedaProveedor" class="form-label">Buscar Proveedor</label>
                                <input type="text" id="busquedaProveedor" class="form-control form-control-sm" placeholder="Escribe nombre de proveedor...">
                            </div>

                            <!-- Proveedor -->
                            <div class="mb-compact">
                                <label for="proveedor" class="form-label">Proveedor</label>
                                <select id="proveedor" class="form-select form-select-sm">
                                    <option value="">Seleccione un proveedor...</option>
                                </select>
                            </div>

                            <hr class="compact">

                            <!-- Búsqueda de Producto -->
                            <div class="mb-compact">
                                <label for="busquedaProductoCompra" class="form-label">Buscar Producto</label>
                                <input type="text" id="busquedaProductoCompra" class="form-control form-control-sm" placeholder="Escribe nombre de producto...">
                            </div>

                            <!-- Producto -->
                            <div class="mb-compact">
                                <label for="productoCompra" class="form-label">Producto</label>
                                <select id="productoCompra" class="form-select form-select-sm">
                                    <option value="">Seleccione un producto...</option>
                                </select>
                            </div>

                            <!-- Precio, Costo y Cantidad en filas -->
                            <div class="row g-1 mb-compact">
                                <div class="col-4">
                                    <label for="precioCompra" class="form-label">Precio Venta</label>
                                    <input type="number" id="precioCompra" class="form-control form-control-sm" step="0.01" min="0" placeholder="0.00">
                                </div>
                                <div class="col-4">
                                    <label for="costoCompra" class="form-label">Costo Compra</label>
                                    <input type="number" id="costoCompra" class="form-control form-control-sm" step="0.01" min="0" placeholder="0.00">
                                </div>
                                <div class="col-4">
                                    <label for="cantidadCompra" class="form-label">Cantidad</label>
                                    <input type="number" id="cantidadCompra" class="form-control form-control-sm" value="1" min="1">
                                </div>
                            </div>

                            <!-- Botón Agregar -->
                            <button id="btnAgregarCompra" class="btn btn-primary btn-sm w-100 mb-1">
                                <i class="bi bi-plus-circle"></i> Agregar Producto
                            </button>

                            <hr class="compact">

                            <!-- Tipo de Pago -->
                            <div class="mb-compact">
                                <label for="tipoPagoCompra" class="form-label">Tipo de Pago</label>
                                <select id="tipoPagoCompra" class="form-select form-select-sm">
                                    <option value="">Seleccione...</option>
                                    <option value="efectivo">Efectivo</option>
                                    <option value="transferencia">Transferencia</option>
                                </select>
                            </div>

                            <!-- Botones -->
                            <div class="row g-1">
                                <div class="col-7">
                                    <button id="btnComprar" class="btn btn-success btn-sm w-100" disabled>
                                        <i class="bi bi-cash-coin"></i> Registrar Compra
                                    </button>
                                </div>
                                <div class="col-5">
                                    <button id="btnLimpiarCompra" class="btn btn-secondary btn-sm w-100">
                                        <i class="bi bi-arrow-clockwise"></i> Limpiar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel Derecho: Tabla -->
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h6 class="mb-0"><i class="bi bi-receipt"></i> Detalle de la Compra</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-container">
                                <table class="table table-sm table-striped table-hover mb-0" id="tablaDetallesCompra">
                                    <thead class="table-dark sticky-top">
                                        <tr>
                                            <th width="30%">Producto</th>
                                            <th width="15%" class="text-end">Precio Venta</th>
                                            <th width="15%" class="text-end">Costo</th>
                                            <th width="10%" class="text-center">Cant.</th>
                                            <th width="15%" class="text-end">Subtotal</th>
                                            <th width="15%" class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="6" class="text-center text-muted py-2">No hay productos agregados</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <!-- Totales -->
                            <div class="totales-box">
                                <div class="row">
                                    <div class="col-7 text-end">Subtotal (Costo):</div>
                                    <div class="col-5 text-end fw-bold">$<span id="subtotalCompra">0.00</span></div>
                                </div>
                                <div class="row">
                                    <div class="col-7 text-end">IVA (13%):</div>
                                    <div class="col-5 text-end fw-bold">$<span id="ivaCompra">0.00</span></div>
                                </div>
                                <hr class="my-1">
                                <div class="row">
                                    <div class="col-7 text-end"><h6 class="mb-0">TOTAL:</h6></div>
                                    <div class="col-5 text-end"><h6 class="mb-0 text-success">$<span id="totalCompra">0.00</span></h6></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Error -->
    <div class="modal fade" id="modalErrorCompra" tabindex="-1" aria-labelledby="modalErrorCompraLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalErrorCompraLabel">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Error
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="errorMensajeCompra">Ha ocurrido un error.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>


    <script>
        (function () {
            // Inicialización de tooltips
            (() => {
                'use strict';
                const tooltipTriggerList = Array.from(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.forEach(tooltipTriggerEl => {
                    new bootstrap.Tooltip(tooltipTriggerEl);
                });
            })();

            // Variables globales
            let detallesCompra = [];
            let numeroOrdenActual = '';
            let debounceProveedor, debounceProductoCompra;

            // Inicializar modales
            let modalErrorCompra;

            // Función de inicialización principal
            function inicializarCompra() {
                inicializarComprador();
                obtenerNumeroOrden();
                cargarProveedores();
                cargarProductosCompra();
                actualizarFechaHoraCompra();

                // Limpiar intervalo previo si existe
                if (window.compraInterval) {
                    clearInterval(window.compraInterval);
                }
                window.compraInterval = setInterval(actualizarFechaHoraCompra, 1000);

                // Inicializar modales
                modalErrorCompra = new bootstrap.Modal(document.getElementById('modalErrorCompra'));

                // Eventos de búsqueda
                $('#busquedaProveedor').off('input').on('input', filtrarProveedores);
                $('#busquedaProductoCompra').off('input').on('input', filtrarProductosCompra);

                // Eventos de botones principales
                $('#btnAgregarCompra').off('click').on('click', agregarProductoCompra);
                $('#btnComprar').off('click').on('click', validarCompra);
                $('#btnLimpiarCompra').off('click').on('click', confirmarLimpiarCompra);

                // Evento cuando selecciona producto - autocompletar precio
                $('#productoCompra').off('change').on('change', cambioProductoCompra);
            }

            // Ejecutar inicialización cuando el DOM esté listo
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', inicializarCompra);
            } else {
                inicializarCompra();
            }

            function inicializarComprador() {
                const nombreEmpleado = localStorage.getItem('empleadoNombre') || 'Sin asignar';
                const partes = nombreEmpleado.trim().split(' ');
                const nombreCorto = partes.length >= 2 ? `${partes[0]} ${partes[partes.length - 2]}` : nombreEmpleado;
                $('#compradorNombre').text(nombreCorto);
            }

            function obtenerNumeroOrden() {
                $.ajax({
                    url: '/api/Compras/nueva-orden',
                    method: 'GET',
                    success: function (numeroOrden) {
                        numeroOrdenActual = numeroOrden;
                        $('#ordenNumero').text(numeroOrden);
                    },
                    error: function (err) {
                        console.error('Error obteniendo número de orden:', err);
                        mostrarModalErrorCompra('Error al obtener el número de orden. Intente recargar la página.');
                    }
                });
            }

            function actualizarFechaHoraCompra() {
                const ahora = new Date();
                $('#fechaActual').text(ahora.toLocaleDateString('es-SV'));
                $('#horaActual').text(ahora.toLocaleTimeString('es-SV'));
            }

            function cargarProveedores() {
                $.ajax({
                    url: '/api/Proveedores/buscar?buscar=',
                    method: 'GET',
                    success: function (data) {
                        const proveedores = data.map(prov => ({
                            id: prov.idProveedor,
                            nombre: prov.nombre
                        }));
                        actualizarSelectProveedores(proveedores);
                    },
                    error: function (err) {
                        console.error('Error cargando proveedores:', err);
                        mostrarModalErrorCompra('Error al cargar proveedores. Intente nuevamente.');
                    }
                });
            }

            function cargarProductosCompra() {
                $.ajax({
                    url: '/api/Inventario/buscar-cajero?buscar=',
                    method: 'GET',
                    success: function (data) {
                        const productos = data.map(inv => ({
                            id: inv.idInventario,
                            nombre: inv.productoNombre,
                            precioVenta: parseFloat(inv.precio)
                        }));
                        actualizarSelectProductosCompra(productos);
                    },
                    error: function (err) {
                        console.error('Error cargando productos:', err);
                        mostrarModalErrorCompra('Error al cargar productos. Intente nuevamente.');
                    }
                });
            }

            function filtrarProveedores() {
                clearTimeout(debounceProveedor);
                debounceProveedor = setTimeout(() => {
                    const busqueda = $('#busquedaProveedor').val();
                    $.ajax({
                        url: `/api/Proveedores/buscar?buscar=${encodeURIComponent(busqueda)}`,
                        method: 'GET',
                        success: function (data) {
                            const proveedores = data.map(prov => ({
                                id: prov.idProveedor,
                                nombre: prov.nombre
                            }));
                            actualizarSelectProveedores(proveedores);
                        },
                        error: function (err) {
                            console.error('Error filtrando proveedores:', err);
                        }
                    });
                }, 300);
            }

            function filtrarProductosCompra() {
                clearTimeout(debounceProductoCompra);
                debounceProductoCompra = setTimeout(() => {
                    const busqueda = $('#busquedaProductoCompra').val();
                    $.ajax({
                        url: `/api/Inventario/buscar-cajero?buscar=${encodeURIComponent(busqueda)}`,
                        method: 'GET',
                        success: function (data) {
                            const productos = data.map(inv => ({
                                id: inv.idInventario,
                                nombre: inv.productoNombre,
                                precioVenta: parseFloat(inv.precio)
                            }));
                            actualizarSelectProductosCompra(productos);
                        },
                        error: function (err) {
                            console.error('Error filtrando productos:', err);
                        }
                    });
                }, 300);
            }

            function actualizarSelectProveedores(proveedores) {
                const select = $('#proveedor');
                select.empty().append('<option value="">Seleccione un proveedor...</option>');
                if (proveedores.length === 0) {
                    select.append('<option value="" disabled>No se encontraron resultados</option>');
                } else {
                    proveedores.forEach(prov => {
                        select.append(`<option value="${prov.id}">${prov.nombre}</option>`);
                    });
                }
            }

            function actualizarSelectProductosCompra(productos) {
                const select = $('#productoCompra');
                select.empty().append('<option value="">Seleccione un producto...</option>');
                if (productos.length === 0) {
                    select.append('<option value="" disabled>No se encontraron resultados</option>');
                } else {
                    productos.forEach(prod => {
                        select.append(`<option value="${prod.id}" data-precio="${prod.precioVenta}">${prod.nombre}</option>`);
                    });
                }
            }

            function cambioProductoCompra() {
                const precioVenta = $('#productoCompra').find(':selected').data('precio') || 0;
                $('#precioCompra').val(precioVenta > 0 ? precioVenta.toFixed(2) : '');
            }

            function agregarProductoCompra() {
                const productoId = $('#productoCompra').val();
                const productoNombre = $('#productoCompra option:selected').text();
                const precioVenta = parseFloat($('#precioCompra').val()) || 0;
                const costo = parseFloat($('#costoCompra').val()) || 0;
                const cantidad = parseInt($('#cantidadCompra').val()) || 1;

                // Validaciones
                if (!productoId) {
                    mostrarModalErrorCompra('Debe seleccionar un producto');
                    return;
                }

                if (costo <= 0) {
                    mostrarModalErrorCompra('El costo debe ser mayor a 0');
                    return;
                }

                if (cantidad <= 0) {
                    mostrarModalErrorCompra('La cantidad debe ser mayor a 0');
                    return;
                }

                const subtotal = costo * cantidad;

                // Verificar si el producto ya existe en la compra
                const indiceExistente = detallesCompra.findIndex(d => d.productoId === productoId);
                if (indiceExistente >= 0) {
                    // Si existe, actualizar cantidad y subtotal
                    detallesCompra[indiceExistente].cantidad += cantidad;
                    detallesCompra[indiceExistente].subtotal = detallesCompra[indiceExistente].costo * detallesCompra[indiceExistente].cantidad;
                } else {
                    // Si no existe, agregar nuevo
                    detallesCompra.push({
                        productoId,
                        productoNombre,
                        precioVenta,
                        costo,
                        cantidad,
                        subtotal
                    });
                }

                actualizarTablaCompra();
                limpiarFormularioProductoCompra();
            }

            function limpiarFormularioProductoCompra() {
                $('#productoCompra').val('');
                $('#precioCompra').val('');
                $('#costoCompra').val('');
                $('#cantidadCompra').val(1);
            }

            function actualizarTablaCompra() {
                const tbody = $('#tablaDetallesCompra tbody');
                tbody.empty();

                if (detallesCompra.length === 0) {
                    tbody.html('<tr><td colspan="6" class="text-center text-muted py-2">No hay productos agregados</td></tr>');
                    $('#btnComprar').prop('disabled', true);
                } else {
                    detallesCompra.forEach((detalle, index) => {
                        tbody.append(`
                    <tr>
                        <td>${detalle.productoNombre}</td>
                        <td class="text-end">$${detalle.precioVenta.toFixed(2)}</td>
                        <td class="text-end">$${detalle.costo.toFixed(2)}</td>
                        <td class="text-center">${detalle.cantidad}</td>
                        <td class="text-end">$${detalle.subtotal.toFixed(2)}</td>
                        <td class="text-center">
                            <div class="btn-group" role="group">
                                <button class="btn btn-outline-warning btn-sm" onclick="abrirModalEditarCompra(${index})">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <button class="btn btn-outline-danger btn-sm" onclick="abrirModalEliminarCompra(${index})">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `);
                    });
                    $('#btnComprar').prop('disabled', false);
                }

                calcularTotalesCompra();
            }

            // Funciones para editar/eliminar (simplificadas)
            window.abrirModalEditarCompra = function (index) {
                const detalle = detallesCompra[index];
                const nuevaCantidad = prompt(`Editar cantidad para ${detalle.productoNombre}:`, detalle.cantidad);

                if (nuevaCantidad && !isNaN(nuevaCantidad) && parseInt(nuevaCantidad) > 0) {
                    detallesCompra[index].cantidad = parseInt(nuevaCantidad);
                    detallesCompra[index].subtotal = detallesCompra[index].costo * detallesCompra[index].cantidad;
                    actualizarTablaCompra();
                }
            };

            window.abrirModalEliminarCompra = function (index) {
                if (confirm(`¿Eliminar ${detallesCompra[index].productoNombre} de la compra?`)) {
                    detallesCompra.splice(index, 1);
                    actualizarTablaCompra();
                }
            };

            function calcularTotalesCompra() {
                const subtotal = detallesCompra.reduce((sum, d) => sum + d.subtotal, 0);
                const iva = subtotal * 0.13;
                const total = subtotal + iva;

                $('#subtotalCompra').text(subtotal.toFixed(2));
                $('#ivaCompra').text(iva.toFixed(2));
                $('#totalCompra').text(total.toFixed(2));
            }

            function validarCompra() {
                const proveedorId = $('#proveedor').val();
                const tipoPago = $('#tipoPagoCompra').val();

                if (!proveedorId) {
                    mostrarModalErrorCompra('Debe seleccionar un proveedor');
                    return;
                }

                if (!tipoPago) {
                    mostrarModalErrorCompra('Debe seleccionar un tipo de pago');
                    return;
                }

                if (detallesCompra.length === 0) {
                    mostrarModalErrorCompra('Debe agregar al menos un producto');
                    return;
                }

                procesarCompra();
            }

            function procesarCompra() {
                const proveedorId = $('#proveedor').val();
                const tipoPago = $('#tipoPagoCompra').val();

                const subtotal = detallesCompra.reduce((sum, d) => sum + d.subtotal, 0);
                const iva = subtotal * 0.13;
                const total = subtotal + iva;

                // Crear objeto de compra
                const compra = {
                    idCompra: 0,
                    idEmpleado: parseInt(localStorage.getItem('empleadoId')) || 0,
                    idProveedor: parseInt(proveedorId),
                    numeroOrden: numeroOrdenActual.trim(),
                    subtotal: subtotal,
                    total: total,
                    iva: iva,
                    metodoPago: tipoPago.charAt(0).toUpperCase() + tipoPago.slice(1),
                    fecha: new Date().toISOString().split('T')[0],
                    hora: new Date().toTimeString().split(' ')[0]
                };

                // Enviar compra primero
                $.ajax({
                    url: '/api/Compras',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(compra),
                    success: function (responseCompra) {
                        const idCompraCreada = responseCompra.idCompra;
                        console.log('Compra creada con ID:', idCompraCreada);

                        // Enviar cada detalle individualmente
                        let detallesEnviados = 0;
                        const totalDetalles = detallesCompra.length;

                        detallesCompra.forEach((detalle, index) => {
                            const detalleCompra = {
                                idCompraDetalle: 0,
                                idCompra: idCompraCreada,
                                idInventario: parseInt(detalle.productoId), // ID de inventario
                                cantidad: detalle.cantidad,
                                precioCompra: detalle.costo,
                                precioVenta: detalle.precioVenta,
                                subtotal: detalle.subtotal
                            };

                            $.ajax({
                                url: '/api/ComprasDetalles',
                                method: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify(detalleCompra),
                                success: function () {
                                    detallesEnviados++;
                                    console.log(`Detalle ${detallesEnviados}/${totalDetalles} enviado`);

                                    // AUMENTAR INVENTARIO - Esto es lo que necesitas
                                    aumentarInventario(detalle.productoId, detalle.cantidad, detalle.precioVenta, () => {
                                        if (detallesEnviados === totalDetalles) {
                                            mostrarModalErrorCompra('✅ Compra registrada exitosamente!\nOrden Nº: ' + numeroOrdenActual, true);
                                            limpiarTodoCompra();
                                        }
                                    });
                                },
                                error: function (err) {
                                    console.error(`Error enviando detalle ${index + 1}:`, err);
                                    mostrarModalErrorCompra(`Error al procesar detalle del producto: ${detalle.productoNombre}`);
                                }
                            });
                        });
                    },
                    error: function (err) {
                        console.error('Error creando compra:', err);
                        mostrarModalErrorCompra('Error al procesar la compra. Intente nuevamente.');
                    }
                });
            }

            function aumentarInventario(idInventario, cantidadComprada, nuevoPrecioVenta, callback) {
                $.ajax({
                    url: `/api/Inventario/aumentar-stock/${idInventario}`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        cantidad: cantidadComprada,
                        nuevoPrecio: nuevoPrecioVenta
                    }),
                    success: function (response) {
                        if (response.mensaje === 'Stock aumentado correctamente.') {
                            console.log(`Inventario aumentado para ID ${idInventario} en ${cantidadComprada}. Nueva cantidad: ${response.cantidad}`);
                            if (callback) callback();
                        } else {
                            mostrarModalErrorCompra(`Error al aumentar stock: ${response.mensaje}`);
                        }
                    },
                    error: function (err) {
                        console.error(`Error aumentando inventario para ID ${idInventario}:`, err);
                        mostrarModalErrorCompra(`Error al actualizar inventario para el producto con ID ${idInventario}`);
                    }
                });
            }

            function confirmarLimpiarCompra() {
                if (confirm('¿Desea limpiar toda la compra actual?')) {
                    limpiarTodoCompra();
                }
            }

            function limpiarTodoCompra() {
                detallesCompra = [];
                $('#proveedor').val('');
                $('#tipoPagoCompra').val('');
                limpiarFormularioProductoCompra();
                actualizarTablaCompra();
                // Obtener nuevo número de orden
                obtenerNumeroOrden();
            }

            function mostrarModalErrorCompra(mensaje, esExito = false) {
                $('#errorMensajeCompra').text(mensaje);
                if (esExito) {
                    $('#modalErrorCompraLabel').html('<i class="bi bi-check-circle-fill me-2"></i>Éxito');
                    $('#modalErrorCompra .modal-header').removeClass('bg-danger').addClass('bg-success');
                } else {
                    $('#modalErrorCompraLabel').html('<i class="bi bi-exclamation-triangle-fill me-2"></i>Error');
                    $('#modalErrorCompra .modal-header').removeClass('bg-success').addClass('bg-danger');
                }
                modalErrorCompra.show();
            }
        })();
    </script>
</body>
</html>
