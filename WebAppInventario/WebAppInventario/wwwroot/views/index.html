<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <title>::.. Sistema de inventario ..::</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>



<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">LOGO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <ul class="navbar-nav me-auto" id="mnxAcademica">
                    <!-- Perfil (Todos) -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-form="perfil">
                            <i class="bi bi-person"></i> Perfil
                        </a>
                    </li>

                    <!-- Inventario (Admin, Bodega) -->
                    <li class="nav-item" >
                        <a class="nav-link" href="#" data-form="inventario">
                            <i class="bi bi-list-check"></i> Inventario
                        </a>
                    </li>

                    <!-- Proveedores (Admin, Bodega) -->
                    <li class="nav-item" >
                        <a class="nav-link" href="#" data-form="proveedores">
                            <i class="bi bi-shop-window"></i> Proveedores
                        </a>
                    </li>

                    <!-- Compras (Admin, Bodega) -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownCompras" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-cart"></i> Compras
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#" data-form="compras">
                                    <i class="bi bi-basket"></i> Compras
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#" data-form="registroCompras">
                                    <i class="bi bi-card-checklist"></i> Registro Compras
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!-- Cajero (Admin, Cajero) -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-form="cajero">
                            <i class="bi bi-cash"></i> Cajero
                        </a>
                    </li>

                    <!-- Facturas (Admin, Cajero) -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-form="facturas">
                            <i class="bi bi-card-list"></i> Facturas
                        </a>
                    </li>

                    <!-- Empleados (Solo Admin) -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-form="empleados">
                            <i class="bi bi-people"></i> Empleados
                        </a>
                    </li>

                    <!-- Clientes (Admin, Cajero) -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-form="clientes">
                            <i class="bi bi-person-square"></i> Clientes
                        </a>
                    </li>
                </ul>

                <!-- Información del usuario y botón de cerrar sesión -->
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3">
                        <i class="bi bi-person-circle"></i>
                        <span id="nombreUsuario">Usuario</span>
                        (<span id="rolUsuario">Rol</span>)
                    </span>
                    <button class="btn btn-outline-danger btn-sm" id="btnCerrarSesion">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <!-- Área principal para cargar el contenido en la parte inferior -->
        <div id="contenido" class="mt-3"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", e => {
            mnxAcademica.addEventListener("click", event => {
                if (event.target.dataset.form) {
                    event.preventDefault();
                    abrirVentana(event.target.dataset.form);
                }
            })
        })
        function abrirVentana(form) {
            let url = `/views/${form}.html`;
            fetch(url)
                .then(resp => resp.text())
                .then(vista => {
                    $('#contenido').html(vista);
                })
                .catch(error => {
                    console.error('Error:', error);
                    $('#contenido').html(`<p>Error al cargar el contenido: ${error.message}</p>`);
                });
        }
    </script>

</body>
</html>
