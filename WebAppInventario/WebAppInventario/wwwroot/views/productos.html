<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos personalizados para scroll interno en la tabla -->
    <style>
        .table-scroll {
            max-height: 400px; /* Altura máxima de la tabla (ajusta según necesites) */
            overflow-y: auto; /* Scroll vertical interno */
        }
    </style>
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container mt-4">
        <!-- Tarjeta principal -->
        <div class="card shadow">
            <!-- Encabezado de la tarjeta -->
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Gestión de Productos</h2>
            </div>

            <!-- Cuerpo de la tarjeta -->
            <div class="card-body">
                <!-- Botones de acción y búsqueda en una fila -->
                <div class="row mb-3 align-items-center">
                    <!-- Botones CRUD al lado izquierdo -->
                    <div class="col-md-6">
                        <button id="btnNuevo" class="btn btn-primary">Nuevo Producto</button>
                        <button id="btnEditar" class="btn btn-warning" disabled>Editar</button>
                        <button id="btnEliminar" class="btn btn-danger" disabled>Eliminar</button>
                    </div>

                    <!-- Buscador al lado derecho -->
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" class="form-control" id="inputBuscar" placeholder="Buscar por nombre o código...">
                            <button class="btn btn-outline-secondary" type="button" id="btnLimpiarBusqueda" title="Limpiar búsqueda">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de productos con scroll responsive e interno -->
                <div class="table-responsive table-scroll">
                    <table class="table table-striped table-hover" id="tablaProductos">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre Producto</th>
                                <th>Código</th>
                                <th>Proveedor</th>
                                <th>Categoría</th>
                                <th>Descripcion</th>
                                <th>Fecha Producción</th>
                                <th>Fecha Vencimiento</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los datos de productos se cargan dinámicamente aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL PARA AGREGAR/EDITAR PRODUCTO ========== -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <!-- Cambié a modal-xl para que quepa todo -->
            <div class="modal-content">
                <!-- Encabezado del modal -->
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitulo">
                        <i class="bi bi-box-seam"></i> Nuevo Producto
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <!-- Cuerpo del modal con todo visible -->
                <div class="modal-body">
                    <form id="formProducto">
                        <!-- Campos ocultos -->
                        <input type="hidden" id="idProducto">
                        <input type="hidden" id="idInventario">  <!-- Agregado para inventario -->
                        <!-- Sección Producto -->
                        <div class="border rounded p-3 mb-4">
                            <h6 class="text-primary mb-3">
                                <i class="bi bi-tag"></i> Información del Producto
                            </h6>

                            <!-- Fila: Proveedor y Categoría -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="idProveedor" class="form-label">
                                        <i class="bi bi-truck"></i> Proveedor
                                    </label>
                                    <select id="idProveedor" class="form-select" required>
                                        <option value="">Seleccione un proveedor</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="idCategoria" class="form-label">
                                        <i class="bi bi-tags"></i> Categoría
                                    </label>
                                    <select id="idCategoria" class="form-select" required>
                                        <option value="">Seleccione una categoría</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Fila: Código y Nombre Producto -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="codigo" class="form-label">
                                        <i class="bi bi-upc"></i> Código
                                    </label>
                                    <input type="text" class="form-control" id="codigo" required readonly>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="nombreProducto" class="form-label">
                                        <i class="bi bi-box"></i> Nombre Producto
                                    </label>
                                    <input type="text" class="form-control" id="nombreProducto" required>
                                </div>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">
                                    <i class="bi bi-textarea"></i> Descripción
                                </label>
                                <textarea class="form-control" id="descripcion" rows="3"></textarea>
                            </div>

                            <!-- Fila: Fechas -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fechaProd" class="form-label">
                                        <i class="bi bi-calendar"></i> Fecha de Producción
                                    </label>
                                    <input type="date" class="form-control" id="fechaProd">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fechaVenc" class="form-label">
                                        <i class="bi bi-calendar-x"></i> Fecha de Vencimiento
                                    </label>
                                    <input type="date" class="form-control" id="fechaVenc">
                                </div>
                            </div>
                        </div>

                        <!-- Sección Inventario (solo visible en modo Nuevo) -->
                        <div class="border rounded p-3 d-none" id="seccionInventario">
                            <!-- Oculta por defecto -->
                            <h6 class="text-success mb-3">
                                <i class="bi bi-clipboard-data"></i> Información del Inventario
                            </h6>

                            <!-- Fila: Precio y Costo -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label">
                                        <i class="bi bi-cash"></i> Precio
                                    </label>
                                    <input type="number" step="0.01" class="form-control" id="precio" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="costo" class="form-label">
                                        <i class="bi bi-calculator"></i> Costo
                                    </label>
                                    <input type="number" step="0.01" class="form-control" id="costo" required>
                                </div>
                            </div>

                            <!-- Fila: Cantidad y Ubicación -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="cantidad" class="form-label">
                                        <i class="bi bi-hash"></i> Cantidad
                                    </label>
                                    <input type="number" class="form-control" id="cantidad" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="ubicacion" class="form-label">
                                        <i class="bi bi-geo-alt"></i> Ubicación
                                    </label>
                                    <input type="text" class="form-control" id="ubicacion" required>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Pie del modal con botones -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" id="btnGuardar">
                        <i class="bi bi-check-circle"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- ========== MODAL DE CONFIRMACIÓN DE ELIMINACIÓN ========== -->
    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Mensaje de confirmación con nombre del producto -->
                    <p class="mb-0">¿Desea eliminar el producto <strong id="nombreProductoEliminar"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Sí, Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL DE ÉXITO ========== -->
    <div class="modal fade" id="modalExito" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Éxito</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Mensaje dinámico de éxito (se cambia desde JavaScript) -->
                    <p class="mb-0" id="mensajeExito"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL DE ERROR ========== -->
    <div class="modal fade" id="modalError" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Error</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Mensaje dinámico de error (se cambia desde JavaScript) -->
                    <p class="mb-0" id="mensajeError"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== JAVASCRIPT PRINCIPAL ========== -->
    <script>
        (function () {
            // ========== VARIABLES GLOBALES ==========
            let productosFiltrados = [];     // Array para almacenar productos filtrados desde la API
            let proveedores = [];              // Array para proveedores
            let categorias = [];               // Array para categorías
            let filaSeleccionada = null;       // Índice de la fila seleccionada en la tabla
            let modoEdicion = false;           // Bandera para saber si estamos editando o agregando
            let modalProducto;                 // Instancia del modal de producto
            let debounceTimer;                 // Timer para debounce en búsqueda

            // ========== FUNCIÓN PARA BUSCAR PRODUCTOS DESDE LA API ==========
            function buscarProductos(textoBusqueda = '') {
                // Limpiar timer anterior para debounce
                clearTimeout(debounceTimer);
                // Esperar 300ms antes de hacer la llamada (evita llamadas excesivas)
                debounceTimer = setTimeout(() => {
                    $.ajax({
                        url: `/api/Productos/buscar?buscar=${encodeURIComponent(textoBusqueda)}`,  // Endpoint de búsqueda
                        method: "GET",
                        success: function (data) {
                            // Mapear los datos recibidos al formato que usamos (ajustado a la estructura real)
                            productosFiltrados = data.map(prod => ({
                                idProducto: prod.idProducto,
                                idProveedor: prod.idProveedor || 0,
                                idCategoria: prod.idCategoria || 0,
                                codigo: prod.codigo ? prod.codigo.trim() : '',
                                nombre: prod.nombre ? prod.nombre.trim() : '',
                                descripcion: prod.descripcion ? prod.descripcion.trim() : '',
                                fechaProd: prod.fechaProd,
                                fechaVenc: prod.fechaVenc,
                                estado: prod.estado,
                                proveedorNombre: prod.proveedor ? prod.proveedor.trim() : '',  // Cambiado de proveedorNombre a proveedor
                                categoriaNombre: prod.categoria ? prod.categoria.trim() : ''   // Cambiado de categoriaNombre a categoria
                            }));
                            renderTabla(); // Actualizar la tabla con los datos filtrados
                            // Resetear selección al buscar
                            filaSeleccionada = null;
                            $("#btnEditar, #btnEliminar").prop("disabled", true);
                        },
                        error: function (err) {
                            console.error("Error buscando productos:", err);
                            // Mostrar modal de error
                            $("#mensajeError").text("Error al buscar productos. Intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                            modalError.show();
                        }
                    });
                }, 300);  // Debounce de 300ms
            }

            // ========== FUNCIÓN PARA RENDERIZAR LA TABLA ==========
            function renderTabla() {
                let tbody = $("#tablaProductos tbody");
                tbody.empty(); // Limpiar el contenido actual de la tabla

                // Si no hay productos, mostrar mensaje
                if (productosFiltrados.length === 0) {
                    let mensaje = "No se encontraron productos con ese criterio de búsqueda";
                    tbody.append(`
                                            <tr>
                                                <td colspan="6" class="text-center text-muted">
                                                    ${mensaje}
                                                </td>
                                            </tr>
                                        `);
                    return;
                }

                // Recorrer el array de productos y crear filas
                productosFiltrados.forEach((prod, i) => {
                    tbody.append(`
                                            <tr data-index="${i}">
                                                <td>${prod.nombre}</td>
                                                <td>${prod.codigo}</td>
                                                <td>${prod.proveedorNombre}</td>
                                                <td>${prod.categoriaNombre}</td>
                                                <td>${prod.descripcion}</td>
                                                <td>${prod.fechaProd ? new Date(prod.fechaProd).toLocaleDateString() : ''}</td>
                                                <td>${prod.fechaVenc ? new Date(prod.fechaVenc).toLocaleDateString() : ''}</td>
                                            </tr>
                                        `);
                });

                // Agregar evento click a cada fila de la tabla
                $("#tablaProductos tbody tr").click(function () {
                    // No hacer nada si es la fila de "no hay productos"
                    if ($(this).find('td').length === 1) return;

                    // Remover la clase de selección de todas las filas
                    $("#tablaProductos tbody tr").removeClass("table-primary");
                    // Agregar clase de selección a la fila clickeada
                    $(this).addClass("table-primary");
                    // Guardar el índice de la fila seleccionada
                    filaSeleccionada = $(this).data("index");

                    // Habilitar los botones de Editar y Eliminar
                    $("#btnEditar, #btnEliminar").prop("disabled", false);
                });
            }

            // ========== FUNCIÓN PARA CARGAR PROVEEDORES ==========
            function cargarProveedores() {
                $.ajax({
                    url: "/api/Proveedores",
                    method: "GET",
                    success: function (data) {
                        proveedores = data;
                        let select = $("#idProveedor");
                        select.empty();
                        select.append('<option value="">Seleccione un proveedor</option>');
                        proveedores.forEach(prov => {
                            select.append(`<option value="${prov.idProveedor}">${prov.nombre.trim()}</option>`);
                        });
                    },
                    error: function (err) {
                        console.error("Error cargando proveedores:", err);
                    }
                });
            }

            // ========== FUNCIÓN PARA CARGAR CATEGORÍAS ==========
            function cargarCategorias() {
                $.ajax({
                    url: "/api/Categorias",
                    method: "GET",
                    success: function (data) {
                        categorias = data;
                        let select = $("#idCategoria");
                        select.empty();
                        select.append('<option value="">Seleccione una categoría</option>');
                        categorias.forEach(cat => {
                            select.append(`<option value="${cat.idCategoria}">${cat.nombre.trim()}</option>`);
                        });
                    },
                    error: function (err) {
                        console.error("Error cargando categorías:", err);
                    }
                });
            }

            // ========== FUNCIÓN PARA CARGAR PRODUCTOS DESDE LA API (PARA INICIALIZACIÓN) ==========
            function cargarProductos() {
                buscarProductos('');  // Inicializar búsqueda vacía (mostrar todos)
            }

            

            // ========== FUNCIÓN PARA LIMPIAR EL FORMULARIO ==========
            function limpiarFormulario() {
                $("#formProducto")[0].reset();  // Reset del formulario HTML
                $("#idProducto").val("");       // Limpiar el ID oculto
                $("#idInventario").val("");     // Limpiar el ID de inventario
            }

            // ========== FUNCIÓN PARA ABRIR MODAL EN MODO "NUEVO" ==========
            function abrirModalNuevo() {
                modoEdicion = false;  // Indicar que estamos agregando
                limpiarFormulario();  // Limpiar el formulario
                // Obtener nuevo código desde la API
                $.ajax({
                    url: "/api/Productos/nuevo-Codigo",
                    method: "GET",
                    success: function (data) {
                        $("#codigo").val(data);  // data es directamente el string del código, ej. "PRD000009"
                    },
                    error: function (err) {
                        console.error("Error obteniendo nuevo código:", err);
                        $("#mensajeError").text("Error al generar código. Intente nuevamente.");
                        let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                        modalError.show();
                    }
                });
                // Mostrar sección de inventario y hacer campos requeridos
                $("#seccionInventario").removeClass("d-none");
                $("#precio, #costo, #cantidad, #ubicacion").prop("required", true);
                // Configurar el título y botón para "Nuevo"
                $("#modalTitulo").text("Nuevo Producto");
                $("#btnGuardar").text("Guardar").removeClass("btn-warning").addClass("btn-primary");
                modalProducto.show();  // Mostrar el modal
            }

            // ========== FUNCIÓN PARA ABRIR MODAL EN MODO "EDITAR" ==========
            function abrirModalEditar() {
                // Validar que hay una fila seleccionada
                if (filaSeleccionada === null) {
                    alert("Seleccione un producto para editar");
                    return;
                }

                modoEdicion = true;  // Indicar que estamos editando
                let prod = productosFiltrados[filaSeleccionada];  // Obtener datos del producto filtrado

                // Llenar el formulario con los datos del producto
                $("#idProducto").val(prod.idProducto);
                $("#idProveedor").val(prod.idProveedor);
                $("#idCategoria").val(prod.idCategoria);
                $("#codigo").val(prod.codigo);
                $("#nombreProducto").val(prod.nombre);
                $("#descripcion").val(prod.descripcion);
                $("#fechaProd").val(prod.fechaProd);
                $("#fechaVenc").val(prod.fechaVenc);

                // Ocultar sección de inventario y quitar required
                $("#seccionInventario").addClass("d-none");
                $("#precio, #costo, #cantidad, #ubicacion").prop("required", false);

                // Configurar el título y botón para "Editar"
                $("#modalTitulo").text("Editar Producto");
                $("#btnGuardar").text("Guardar Cambios").removeClass("btn-primary").addClass("btn-warning");
                modalProducto.show();  // Mostrar el modal
            }

            // ========== FUNCIÓN PARA GUARDAR PRODUCTO (AGREGAR O EDITAR) ==========
            function guardarProducto() {
                // Validar que el formulario esté completo
                if (!$("#formProducto")[0].checkValidity()) {
                    $("#formProducto")[0].reportValidity();
                    return;
                }

                // Recopilar datos del formulario
                let datosProducto = {
                    idProducto: 0,  // Se ajusta en modo edición
                    idProveedor: Number($("#idProveedor").val()),
                    idCategoria: Number($("#idCategoria").val()),
                    codigo: $("#codigo").val(),
                    nombre: $("#nombreProducto").val(),
                    descripcion: $("#descripcion").val(),
                    estado: true,
                    fechaProd: $("#fechaProd").val() || null,
                    fechaVenc: $("#fechaVenc").val() || null
                };

                // ===== MODO EDICIÓN (PUT) =====
                if (modoEdicion) {
                    datosProducto.idProducto = Number($("#idProducto").val());
                    $.ajax({
                        url: `/api/Productos/${datosProducto.idProducto}`,
                        method: "PUT",
                        contentType: "application/json",
                        data: JSON.stringify(datosProducto),
                        success: function () {
                            modalProducto.hide();  // Ocultar modal del formulario
                            // Mostrar modal de éxito
                            $("#mensajeExito").text("El producto fue actualizado exitosamente.");
                            let modalExito = new bootstrap.Modal(document.getElementById('modalExito'));
                            modalExito.show();
                            // Recargar datos y resetear selección
                            buscarProductos($("#inputBuscar").val());  // Recargar con la búsqueda actual
                            filaSeleccionada = null;
                            $("#btnEditar, #btnEliminar").prop("disabled", true);
                        },
                        error: function (err) {
                            console.error(err);
                            modalProducto.hide();  // Ocultar modal del formulario
                            // Mostrar modal de error
                            $("#mensajeError").text("No se pudo actualizar el producto. Por favor, intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                            modalError.show();
                        }
                    });
                }
                // ===== MODO AGREGAR (POST) =====
                else {
                    // Crear producto primero
                    $.ajax({
                        url: "/api/Productos",
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify(datosProducto),
                        success: function (productoCreado) {
                            let idProductoNuevo = productoCreado.idProducto;
                            // Recopilar datos de inventario
                            let datosInventario = {
                                idInventario: 0,
                                idProducto: idProductoNuevo,
                                precio: Number($("#precio").val()),
                                costo: Number($("#costo").val()),
                                cantidad: Number($("#cantidad").val()),
                                ubicacion: $("#ubicacion").val(),
                                ultimaActualizacion: new Date().toISOString().split('T')[0]
                            };
                            // Crear inventario
                            $.ajax({
                                url: "/api/Inventario",
                                method: "POST",
                                contentType: "application/json",
                                data: JSON.stringify(datosInventario),
                                success: function () {
                                    modalProducto.hide();  // Ocultar modal del formulario
                                    // Mostrar modal de éxito
                                    $("#mensajeExito").text("El producto y su inventario fueron agregados exitosamente.");
                                    let modalExito = new bootstrap.Modal(document.getElementById('modalExito'));
                                    modalExito.show();
                                    // Recargar datos
                                    buscarProductos($("#inputBuscar").val());  // Recargar con la búsqueda actual
                                },
                                error: function (err) {
                                    console.error(err);
                                    modalProducto.hide();  // Ocultar modal del formulario
                                    // Mostrar modal de error
                                    $("#mensajeError").text("Producto creado, pero error al agregar inventario. Verifique manualmente.");
                                    let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                                    modalError.show();
                                }
                            });
                        },
                        error: function (err) {
                            console.error(err);
                            modalProducto.hide();  // Ocultar modal del formulario
                            // Mostrar modal de error
                            $("#mensajeError").text("No se pudo agregar el producto. Por favor, intente nuevamente.");
                            let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                            modalError.show();
                        }
                    });
                }
            }

            // ========== FUNCIÓN PARA MOSTRAR MODAL DE CONFIRMACIÓN DE ELIMINACIÓN ==========
            function eliminarProducto() {
                // Validar que hay una fila seleccionada
                if (filaSeleccionada === null) {
                    alert("Seleccione un producto para eliminar");
                    return;
                }

                let prod = productosFiltrados[filaSeleccionada];

                // Mostrar el nombre del producto en el modal de confirmación
                $("#nombreProductoEliminar").text(prod.nombre);
                let modalEliminar = new bootstrap.Modal(document.getElementById('modalEliminar'));
                modalEliminar.show();
            }

            // ========== FUNCIÓN PARA CONFIRMAR Y EJECUTAR LA ELIMINACIÓN ==========
            function confirmarEliminacion() {
                let prod = productosFiltrados[filaSeleccionada];
                let modalEliminar = bootstrap.Modal.getInstance(document.getElementById('modalEliminar'));

                // Soft Delete: actualizar estado del producto a false
                $.ajax({
                    url: `/api/Productos/${prod.idProducto}`,
                    method: "PUT",  // Usar PUT para soft delete
                    contentType: "application/json",
                    data: JSON.stringify({ estado: false }),
                    success: function () {
                        modalEliminar.hide();  // Ocultar modal de confirmación
                        // Mostrar modal de éxito
                        $("#mensajeExito").text("El producto fue eliminado exitosamente.");
                        let modalExito = new bootstrap.Modal(document.getElementById('modalExito'));
                        modalExito.show();
                        // Recargar datos y resetear selección
                        buscarProductos($("#inputBuscar").val());  // Recargar con la búsqueda actual
                        filaSeleccionada = null;
                        $("#btnEditar, #btnEliminar").prop("disabled", true);
                    },
                    error: function (err) {
                        console.error(err);
                        modalEliminar.hide();  // Ocultar modal de confirmación
                        // Mostrar modal de error
                        $("#mensajeError").text("No se pudo eliminar el producto. Por favor, intente nuevamente.");
                        let modalError = new bootstrap.Modal(document.getElementById('modalError'));
                        modalError.show();
                    }
                });
            }

            // ========== INICIALIZACIÓN CUANDO EL DOCUMENTO ESTÁ LISTO ==========
            $(document).ready(function () {
                // Crear instancia del modal de producto
                modalProducto = new bootstrap.Modal(document.getElementById('modalProducto'));

                // Cargar datos iniciales
                cargarProveedores();
                cargarCategorias();
                cargarProductos();

                // ===== ASIGNAR EVENTOS A LOS BOTONES =====
                $("#btnNuevo").click(abrirModalNuevo);                    // Botón "Nuevo Producto"
                $("#btnEditar").click(abrirModalEditar);                  // Botón "Editar"
                $("#btnEliminar").click(eliminarProducto);                // Botón "Eliminar"
                $("#btnGuardar").click(guardarProducto);                  // Botón "Guardar" en el modal
                $("#btnConfirmarEliminar").click(confirmarEliminacion);    // Botón "Sí, Eliminar"

                // ===== LIMPIAR FORMULARIO AL CERRAR EL MODAL =====
                $('#modalProducto').on('hidden.bs.modal', function () {
                    limpiarFormulario();
                });

                // ===== BÚSQUEDA EN TIEMPO REAL CON DEBOUNCE =====
                $("#inputBuscar").on("input", function () {
                    let textoBusqueda = $(this).val();
                    buscarProductos(textoBusqueda);
                });

                // ===== LIMPIAR BÚSQUEDA =====
                $("#btnLimpiarBusqueda").click(function () {
                    $("#inputBuscar").val("");
                    buscarProductos("");  // Limpiar búsqueda
                    // Resetear selección
                    filaSeleccionada = null;
                    $("#btnEditar, #btnEliminar").prop("disabled", true);
                });
            });
        })();
    </script>
</body>
</html>
