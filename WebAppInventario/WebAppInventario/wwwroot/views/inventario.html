<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Búsqueda de Inventario</title>  <!-- Título cambiado para reflejar solo búsqueda -->
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos personalizados para scroll interno en la tabla -->
    <style>
        .table-scroll {
            max-height: 400px; /* Altura máxima de la tabla (ajusta según necesites) */
            overflow-y: auto; /* Scroll vertical interno */
        }
    </style>
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container mt-4">
        <!-- Tarjeta principal -->
        <div class="card shadow">
            <!-- Encabezado de la tarjeta -->
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Búsqueda de Inventario</h2>  <!-- Título cambiado -->
            </div>

            <!-- Cuerpo de la tarjeta -->
            <div class="card-body">
                <!-- Solo el buscador (removidos los botones CRUD) -->
                <div class="row mb-3 align-items-center">
                    <!-- Buscador al lado derecho (ahora ocupa toda la fila) -->
                    <div class="col-md-12">
                        <!-- Cambiado a col-md-12 para ocupar toda la fila -->
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" class="form-control" id="inputBuscar" placeholder="Buscar por nombre de producto...">
                            <button class="btn btn-outline-secondary" type="button" id="btnLimpiarBusqueda" title="Limpiar búsqueda">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de inventario con scroll responsive e interno -->
                <div class="table-responsive table-scroll">
                    <table class="table table-striped table-hover" id="tablaInventario">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre Producto</th>
                                <th>Código</th>
                                <th>Proveedor</th>
                                <th>Precio</th>
                                <th>Costo</th>
                                <th>Cantidad</th>
                                <th>Ubicación</th>
                                <th>Última Actualización</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los datos de inventario se cargan dinámicamente aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODALES REMOVIDOS ========== -->
    <!-- Se eliminaron los modales para agregar/editar, eliminación y mensajes de éxito/error, ya que no se usan en modo solo búsqueda -->
    <!-- ========== JAVASCRIPT SIMPLIFICADO ========== -->
    <script>
        // IIFE (Immediately Invoked Function Expression) para encapsular el código
        (function () {
            // ========== VARIABLES GLOBALES ==========
            let inventariosFiltrados = [];     // Array para almacenar inventarios filtrados desde la API
            let debounceTimer;                 // Timer para debounce en búsqueda

            // ========== FUNCIÓN PARA BUSCAR INVENTARIOS DESDE LA API ==========
            function buscarInventarios(textoBusqueda = '') {
                // Limpiar timer anterior para debounce
                clearTimeout(debounceTimer);
                // Esperar 300ms antes de hacer la llamada (evita llamadas excesivas)
                debounceTimer = setTimeout(() => {
                    $.ajax({
                        url: `/api/Inventario/buscar?buscar=${encodeURIComponent(textoBusqueda)}`,  // Endpoint de búsqueda
                        method: "GET",
                        success: function (data) {
                            // Mapear los datos recibidos al formato que usamos
                            inventariosFiltrados = data.map(inv => ({
                                idInventario: inv.idInventario,
                                idProducto: inv.idProducto,
                                idProveedor: inv.idProveedor || '',
                                idCategoria: inv.idCategoria || '',
                                precio: Number(inv.precio),
                                costo: Number(inv.costo),
                                cantidad: Number(inv.cantidad),
                                ubicacion: inv.ubicacion.trim(),
                                ultimaActualizacion: inv.ultimaActualizacion,
                                productoCodigo: inv.productoCodigo.trim(),
                                productoNombre: inv.productoNombre.trim(),
                                productoDescripcion: inv.productoDescripcion.trim(),
                                productoFechaProd: inv.productoFechaProd,
                                productoFechaVenc: inv.productoFechaVenc,
                                productocategoria: inv.productocategoria.trim(),
                                productoproveedor: inv.productoproveedor.trim()
                            }));
                            renderTabla(); // Actualizar la tabla con los datos filtrados
                        },
                        error: function (err) {
                            console.error("Error buscando inventarios:", err);
                            // Como no hay modales de error, solo logueamos (o podrías agregar un alert simple si quieres)
                            alert("Error al buscar productos. Intente nuevamente.");
                        }
                    });
                }, 300);  // Debounce de 300ms
            }

            // ========== FUNCIÓN PARA RENDERIZAR LA TABLA ==========
            function renderTabla() {
                let tbody = $("#tablaInventario tbody");
                tbody.empty(); // Limpiar el contenido actual de la tabla

                // Si no hay inventarios, mostrar mensaje
                if (inventariosFiltrados.length === 0) {
                    let mensaje = "No se encontraron productos con ese criterio de búsqueda";
                    tbody.append(`
                                <tr>
                                    <td colspan="8" class="text-center text-muted">
                                        ${mensaje}
                                    </td>
                                </tr>
                            `);
                    return;
                }

                // Recorrer el array de inventarios y crear filas
                inventariosFiltrados.forEach((inv) => {
                    tbody.append(`
                                <tr>
                                    <td>${inv.productoNombre}</td>
                                    <td>${inv.productoCodigo}</td>
                                    <td>${inv.productoproveedor}</td>
                                    <td>${inv.precio.toFixed(2)}</td>
                                    <td>${inv.costo.toFixed(2)}</td>
                                    <td>${inv.cantidad}</td>
                                    <td>${inv.ubicacion}</td>
                                    <td>${new Date(inv.ultimaActualizacion).toLocaleDateString()}</td>
                                </tr>
                            `);
                });

                // Removido: Eventos de clic en filas, ya que no hay acciones a realizar
            }

            // ========== FUNCIÓN PARA CARGAR INVENTARIOS DESDE LA API (PARA INICIALIZACIÓN) ==========
            function cargarInventarios() {
                buscarInventarios('');  // Inicializar búsqueda vacía (mostrar todos)
            }

            // ========== INICIALIZACIÓN CUANDO EL DOCUMENTO ESTÁ LISTO ==========
            $(document).ready(function () {
                // Cargar datos iniciales
                cargarInventarios();

                // ===== BÚSQUEDA EN TIEMPO REAL CON DEBOUNCE =====
                $("#inputBuscar").on("input", function () {
                    let textoBusqueda = $(this).val();
                    buscarInventarios(textoBusqueda);
                });

                // ===== LIMPIAR BÚSQUEDA =====
                $("#btnLimpiarBusqueda").click(function () {
                    $("#inputBuscar").val("");
                    buscarInventarios("");  // Limpiar búsqueda
                });
            });
        })();
    </script>
</body>
</html>
